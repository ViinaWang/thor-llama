name: Build llama.cpp for Thor (aarch64 + CUDA SM101)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            cmake \
            build-essential \
            wget \
            file

      - name: Install CUDA Toolkit 12.8 (x86_64 nvcc)
        run: |
          # x86_64 CUDA 12.8 — provides nvcc compiler
          wget -q https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/cuda_12.8.0_565.57.01_linux.run
          chmod +x cuda_12.8.0_565.57.01_linux.run
          sudo ./cuda_12.8.0_565.57.01_linux.run --silent \
            --toolkit \
            --no-opengl-libs \
            --no-drm \
            --no-man-page

          /usr/local/cuda-12.8/bin/nvcc --version | tail -1

      - name: Get aarch64 CUDA runtime libraries
        run: |
          # 下载 aarch64 CUDA 12.8 (Jetson Thor 兼容版)
          # sbsa = Server Boot Standard Architecture, aarch64 GPU 服务器版
          # 包含我们需要的 aarch64 libcudart/libcublas 等
          wget -q https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/cuda_12.8.0_565.57.01_linux_sbsa_aarch64.run -O cuda_arm64.run
          chmod +x cuda_arm64.run

          # 提取 (不解码驱动, 只要库文件)
          ./cuda_arm64.run --extract=/tmp/cuda_arm64 --silent || true
          ls /tmp/cuda_arm64/ | head -5

          # 或者直接用 archive 方式安装到自定义路径
          mkdir -p /tmp/cuda_arm64_libs
          if [ -f /tmp/cuda_arm64/cuda-arm64*.run ]; then
            INNER=$(ls /tmp/cuda_arm64/cuda-arm64*.run | head -1)
            echo "Extracting inner: $INNER"
            chmod +x "$INNER"
            cd /tmp/cuda_arm64_libs
            tar xf "$INNER" 2>/dev/null || cpio -id < "$INNER" 2>/dev/null || true
            find . -name "libcudart*" -o -name "libcublas*" | head -10
          else
            # 尝试直接从外层 runfile 提取
            cd /tmp/cuda_arm64
            ls -la
            # fallback: 用 7z 或 cpio 解开
            which 7z || sudo apt-get install -y p7zip-full
            7z x cuda_arm64.run -o/tmp/cuda_arm64_extracted 2>/dev/null || true
            find /tmp/cuda_arm64_extracted -name "*.run" -o -name "*.tar*" | head -5
          fi

      - name: Find aarch64 CUDA libs
        id: cuda_libs
        run: |
          # 在所有解压路径中查找 aarch64 CUDA 运行时库
          FOUND_LIB=""
          for dir in /tmp/cuda_arm64 /tmp/cuda_arm64_libs /tmp/cuda_arm64_extracted; do
            LIB=$(find "$dir" -name "libcudart.so*" -path "*/lib*" 2>/dev/null | head -1)
            if [ -n "$LIB" ]; then
              LIB_DIR=$(dirname "$LIB")
              echo "Found aarch64 CUDA libs at: $LIB_DIR"
              echo "lib_dir=$LIB_DIR" >> $GITHUB_OUTPUT
              ls "$LIB_DIR" | head -10
              FOUND_LIB="yes"
              break
            fi
          done

          if [ -z "$FOUND_LIB" ]; then
            echo "::warning::aarch64 CUDA libs not found — building CPU-only"
            echo "lib_dir=none" >> $GITHUB_OUTPUT
          fi

      - name: Clone llama.cpp
        run: |
          git clone --depth 1 --recursive https://github.com/ggerganov/llama.cpp.git llama.cpp

      - name: Build
        run: |
          cd llama.cpp
          mkdir -p build && cd build

          CUDA_LIB_DIR="${{ steps.cuda_libs.outputs.lib_dir }}"

          if [ "$CUDA_LIB_DIR" != "none" ] && [ -n "$CUDA_LIB_DIR" ]; then
            echo "=== Building with CUDA support ==="
            cmake .. \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
              -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
              -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
              -DCMAKE_C_FLAGS="-O3 -fopenmp" \
              -DCMAKE_CXX_FLAGS="-O3 -fopenmp" \
              -DGGML_CUDA=ON \
              -DCMAKE_CUDA_ARCHITECTURES=101 \
              -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc \
              -DCMAKE_CUDA_HOST_COMPILER=/usr/bin/aarch64-linux-gnu-g++ \
              "-DCMAKE_CUDA_FLAGS=--compiler-bindir=/usr/bin/aarch64-linux-gnu-g++;-O3" \
              -DCMAKE_LIBRARY_PATH="$CUDA_LIB_DIR" \
              -DCMAKE_BUILD_TYPE=Release
          else
            echo "=== Building CPU-only (no CUDA libs found) ==="
            cmake .. \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
              -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
              -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
              -DCMAKE_C_FLAGS="-O3 -fopenmp" \
              -DCMAKE_CXX_FLAGS="-O3 -fopenmp" \
              -DGGML_CUDA=OFF \
              -DCMAKE_BUILD_TYPE=Release
          fi

          make -j$(nproc) 2>&1 | tail -5

      - name: Package
        run: |
          cd llama.cpp/build/bin
          ls -la

          # 收集 aarch64 CUDA 库
          CUDA_LIB_DIR="${{ steps.cuda_libs.outputs.lib_dir }}"
          PKG_EXTRA=""

          if [ "$CUDA_LIB_DIR" != "none" ] && [ -n "$CUDA_LIB_DIR" ]; then
            for lib in libcudart.so.12 libcublas.so.12 libcublasLt.so.12; do
              found=$(find "$CUDA_LIB_DIR" -name "$lib*" 2>/dev/null | head -1)
              if [ -n "$found" ]; then
                cp "$found" .
                PKG_EXTRA="$PKG_EXTRA $lib"
              fi
            done
          fi

          tar czf /tmp/llama-cuda-thor.tar.gz \
            llama-cli \
            llama-server \
            llama-benchmark \
            llama-quantize \
            $PKG_EXTRA

          file llama-cli
          ls -lh /tmp/llama-cuda-thor.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cuda-thor
          path: /tmp/llama-cuda-thor.tar.gz
          retention-days: 90
          compression-level: 0
