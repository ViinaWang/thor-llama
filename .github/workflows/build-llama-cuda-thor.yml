name: Build llama.cpp for Thor (aarch64 + CUDA SM101)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Setup QEMU for arm64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Pull and verify NVIDIA CUDA arm64 image
        run: |
          # NVIDIA 官方 CUDA 镜像 — multi-arch (包含 arm64 变体)
          # "devel" = 包含 nvcc + 头文件 + 开发库 (不只是运行时)
          docker pull --platform linux/arm64 nvidia/cuda:12.8.0-devel-ubuntu24.04
          docker image inspect nvidia/cuda:12.8.0-devel-ubuntu24.04 | grep -E "Architecture|Os" | head -3

      - name: Build llama.cpp in CUDA arm64 container
        run: |
          mkdir -p output
          docker run --rm \
            --platform linux/arm64 \
            -v $(pwd)/output:/output \
            nvidia/cuda:12.8.0-devel-ubuntu24.04 \
            bash -euxo pipefail '
              echo "=== Arch: $(uname -m) ==="

              # CUDA 已预装 — 验证
              nvcc --version | tail -1
              ls /usr/local/cuda/lib64/ | head -5

              # 安装编译依赖
              apt-get update -qq
              apt-get install -y -qq cmake git

              # 编译 llama.cpp
              git clone --depth 1 https://github.com/ggerganov/llama.cpp.git /tmp/llama.cpp
              cd /tmp/llama.cpp
              mkdir -p build && cd build

              cmake .. \
                -DGGML_CUDA=ON \
                -DCMAKE_CUDA_ARCHITECTURES=101 \
                -DCMAKE_BUILD_TYPE=Release

              make -j4

              # 验证
              file bin/llama-cli | grep -q "ARM aarch64" && echo "✓ aarch64 binary" || exit 1
              file bin/llama-cli | grep -q "ARM aarch64" || { echo "✗ wrong arch"; exit 1; }

              # 复制产物
              cp bin/llama-cli bin/llama-server bin/llama-benchmark bin/llama-quantize /output/

              for lib in libggml*.so; do
                [ -f "bin/$lib" ] && cp "bin/$lib" /output/
              done

              # 复制 CUDA 运行时
              for lib in libcudart.so.12 libcublas.so.12 libcublasLt.so.12; do
                found=$(find /usr/local/cuda /usr/lib -name "$lib" 2>/dev/null | head -1)
                [ -n "$found" ] && cp "$found" /output/ && echo "Copied: $lib" || true
              done

              echo "=== Artifacts ==="
              ls -la /output/
            '

      - name: Package
        run: |
          cd output
          ls -la
          tar czf ../llama-cuda-thor.tar.gz *
          cd ..
          ls -lh llama-cuda-thor.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cuda-thor
          path: llama-cuda-thor.tar.gz
          retention-days: 90
          compression-level: 0
