name: Build llama.cpp for Thor (aarch64 + CUDA SM101)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Setup QEMU for arm64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build in arm64 Docker with CUDA from SBSA apt repo
        run: |
          mkdir -p output
          docker run --rm \
            --platform linux/arm64 \
            -v $(pwd)/output:/output \
            ubuntu:24.04 \
            bash -euxo pipefail '
              echo "=== Arch: $(uname -m) ==="

              apt-get update -qq
              apt-get install -y -qq \
                cmake build-essential wget git file gnupg

              echo "=== Install CUDA 12.8 via SBSA apt (native aarch64) ==="
              wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/cuda-keyring_1.1-1_all.deb
              dpkg -i cuda-keyring_1.1-1_all.deb
              apt-get update -qq

              # 安装 nvcc (aarch64 原生版, 从 SBSA 仓库)
              apt-get install -y -qq cuda-nvcc-12-8 2>/dev/null || \
              apt-get install -y -qq cuda-nvcc-12-8 cuda-libraries-12-8 2>/dev/null || \
              apt-get install -y -qq cuda-toolkit-12-8

              # 验证 nvcc
              if command -v nvcc &>/dev/null; then
                nvcc --version | tail -1
              elif [ -f /usr/local/cuda-12.8/bin/nvcc ]; then
                export PATH=/usr/local/cuda-12.8/bin:$PATH
                nvcc --version | tail -1
              elif [ -f /usr/local/cuda/bin/nvcc ]; then
                export PATH=/usr/local/cuda/bin:$PATH
                nvcc --version | tail -1
              else
                echo "ERROR: nvcc not found after install"
                dpkg -l | grep cuda | head -10
                apt-cache search cuda-nvcc | head -5
                exit 1
              fi

              # CUDA 库路径
              export LD_LIBRARY_PATH=/usr/local/cuda/lib64:/usr/local/cuda-12.8/lib64:$LD_LIBRARY_PATH

              echo "=== Clone and build llama.cpp ==="
              git clone --depth 1 https://github.com/ggerganov/llama.cpp.git /tmp/llama.cpp
              cd /tmp/llama.cpp
              mkdir -p build && cd build

              cmake .. \
                -DGGML_CUDA=ON \
                -DCMAKE_CUDA_ARCHITECTURES=101 \
                -DCMAKE_BUILD_TYPE=Release

              make -j4

              echo "=== Verify output ==="
              file bin/llama-cli | grep -q "ARM aarch64" && echo "✓ aarch64 binary" || echo "✗ wrong arch"
              file bin/llama-cli | grep -q "ARM aarch64" || exit 1

              echo "=== Copy artifacts ==="
              cp bin/llama-cli bin/llama-server bin/llama-benchmark bin/llama-quantize /output/

              # 复制共享库
              for lib in libggml*.so; do
                [ -f "bin/$lib" ] && cp "bin/$lib" /output/
              done

              # 复制 CUDA 运行时 (如果不在系统路径)
              for lib in libcudart.so.12 libcublas.so.12 libcublasLt.so.12; do
                found=$(find /usr/local/cuda* /usr/lib /lib -name "$lib" 2>/dev/null | head -1)
                [ -n "$found" ] && cp "$found" /output/ && echo "Copied: $lib" || true
              done

              echo "=== Done ==="
              ls -la /output/
            '

      - name: Package
        run: |
          cd output
          ls -la
          tar czf ../llama-cuda-thor.tar.gz *
          cd ..
          ls -lh llama-cuda-thor.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cuda-thor
          path: llama-cuda-thor.tar.gz
          retention-days: 90
          compression-level: 0
