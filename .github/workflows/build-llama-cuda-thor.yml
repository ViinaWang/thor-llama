name: Build llama.cpp for Thor (aarch64 + CUDA SM101)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Install cross toolchain + CUDA keyring
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            cmake \
            build-essential \
            wget \
            file \
            dpkg-dev

          # NVIDIA CUDA apt 仓库 (x86_64 — 提供 nvcc)
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq

          # 只安装 nvcc (不装驱动不装完整 toolkit — CI 上没有 GPU)
          sudo apt-get install -y -qq cuda-nvcc-12-8

          /usr/local/cuda-12.8/bin/nvcc --version | tail -1

      - name: Download aarch64 CUDA libraries from NVIDIA SBSA repo
        run: |
          # NVIDIA SBSA = ARM 服务器 CUDA 库 (aarch64)
          # 和 Jetson Thor 用同一套 CUDA Runtime API
          mkdir -p /tmp/cuda_arm64
          cd /tmp/cuda_arm64

          BASE=https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa

          # CUDA Runtime + cuBLAS (aarch64)
          for pkg in \
            libcudart12 \
            libcublas12 \
            libcublaslt12; do
            # 列出可用版本并下载最新
            VERSION=$(curl -s ${BASE}/dists/stable/main/binary-sbsa/Packages 2>/dev/null | \
              grep -A2 "^Package: ${pkg}$" | grep Filename | tail -1 | awk '{print $2}')
            if [ -z "$VERSION" ]; then
              # 直接猜文件名 (CUDA 12.8)
              VERSION=$(curl -s ${BASE}/pool/main/n/ 2>/dev/null | \
                grep -o "${pkg}_12\.8\.[0-9-]*_arm64\.deb" | head -1)
            fi

            if [ -n "$VERSION" ]; then
              echo "Downloading: $VERSION"
              if [[ "$VERSION" == /* ]]; then
                wget -q "${BASE}${VERSION}" -O "${pkg}.deb"
              else
                wget -q "${BASE}/pool/main/n/${pkg}/${VERSION}" -O "${pkg}.deb" 2>/dev/null || \
                wget -q "${BASE}/${VERSION}" -O "${pkg}.deb" 2>/dev/null || true
              fi
              [ -s "${pkg}.deb" ] && echo "  OK: $(ls -lh ${pkg}.deb | awk '{print $5}')"
            else
              echo "::warning::Could not find $pkg"
            fi
          done

          # 如果上面的方法失败, 用 dpkg 直接从已知 URL 下载
          # CUDA 12.8 SBSA 的已知路径模式
          if [ ! -s libcudart12.deb ]; then
            echo "Trying known URL patterns for CUDA 12.8 aarch64..."
            for url in \
              "${BASE}/pool/main/n/libcudart12/libcudart12_12.8.61-1_arm64.deb" \
              "${BASE}/pool/main/n/libcudart12/libcudart-12-8_12.8.61-1_arm64.deb" \
              "https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/cuda_12.8.0_565.57.01_linux_sbsa_aarch64.deb"; do
              echo "  Trying: $url"
              wget -q "$url" -O libcudart12.deb 2>/dev/null && [ -s libcudart12.deb ] && break
            done
          fi

          ls -lh *.deb 2>/dev/null || echo "::error::No CUDA aarch64 libraries downloaded"

      - name: Extract aarch64 CUDA libraries
        run: |
          mkdir -p /tmp/cuda_arm64_libs
          cd /tmp/cuda_arm64

          for deb in *.deb; do
            [ -s "$deb" ] || continue
            echo "Extracting: $deb"
            dpkg-deb -x "$deb" /tmp/cuda_arm64_libs/ 2>/dev/null || \
            ar x "$deb" && tar xf data.tar.* -C /tmp/cuda_arm64_libs/ 2>/dev/null || true
          done

          echo "=== Extracted aarch64 CUDA libs ==="
          find /tmp/cuda_arm64_libs -name "libcudart*" -o -name "libcublas*" | while read f; do
            file "$f" | grep -q "ARM aarch64" && echo "  [OK] $f"
          done

          # 也需要 aarch64 CUDA headers
          find /tmp/cuda_arm64_libs -name "cuda_runtime.h" | head -3

          # 如果 dpkg-deb 提取失败, 检查
          LIBDIR=$(find /tmp/cuda_arm64_libs -name "libcudart.so*" 2>/dev/null | head -1 | xargs dirname 2>/dev/null)
          echo "CUDA_ARM64_LIBDIR=${LIBDIR}" >> $GITHUB_ENV
          echo "libdir=$LIBDIR" >> $GITHUB_OUTPUT
          [ -n "$LIBDIR" ] && echo "Found lib dir: $LIBDIR" || echo "::error::No aarch64 CUDA libs found"

        id: extract

      - name: Clone llama.cpp
        run: |
          git clone --depth 1 --recursive https://github.com/ggerganov/llama.cpp.git llama.cpp

      - name: Build (aarch64 + CUDA SM101)
        run: |
          CUDA_LIB_DIR="${{ steps.extract.outputs.libdir }}"
          echo "Using CUDA libs from: $CUDA_LIB_DIR"

          if [ -z "$CUDA_LIB_DIR" ] || [ ! -d "$CUDA_LIB_DIR" ]; then
            echo "::error::No aarch64 CUDA libs — cannot build CUDA version"
            exit 1
          fi

          # 找 CUDA headers (可能在 /usr/local/cuda-12.8 或 arm64 提取目录)
          CUDA_INC=$(find /usr/local/cuda-12.8 /tmp/cuda_arm64_libs -name "cuda_runtime.h" 2>/dev/null | head -1 | xargs dirname 2>/dev/null | xargs dirname 2>/dev/null)
          echo "CUDA include dir: $CUDA_INC"

          cd llama.cpp
          mkdir -p build && cd build

          cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_C_FLAGS="-O3 -fopenmp" \
            -DCMAKE_CXX_FLAGS="-O3 -fopenmp" \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=101 \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc \
            -DCMAKE_CUDA_HOST_COMPILER=/usr/bin/aarch64-linux-gnu-g++ \
            "-DCMAKE_CUDA_FLAGS=--compiler-bindir=/usr/bin/aarch64-linux-gnu-g++;-O3" \
            "-DCUDAToolkit_INCLUDE_DIR=$CUDA_INC" \
            "-DCUDAToolkit_LIBRARY_DIR=$CUDA_LIB_DIR" \
            "-DCMAKE_EXE_LINKER_FLAGS=-L$CUDA_LIB_DIR" \
            "-DCMAKE_SHARED_LINKER_FLAGS=-L$CUDA_LIB_DIR" \
            -DCMAKE_BUILD_TYPE=Release

          make -j$(nproc) 2>&1 | tail -5
          echo "=== Build output ==="
          file bin/llama-cli

      - name: Package
        run: |
          cd llama.cpp/build/bin
          ls -la

          # 从提取目录复制 aarch64 CUDA 库
          CUDA_LIB_DIR="${{ steps.extract.outputs.libdir }}"

          tar czf /tmp/llama-cuda-thor.tar.gz \
            llama-cli \
            llama-server \
            llama-benchmark \
            llama-quantize \
            $(ls ${CUDA_LIB_DIR}/libcudart.so* 2>/dev/null | head -1) \
            $(ls ${CUDA_LIB_DIR}/libcublas.so* 2>/dev/null | head -1) \
            $(ls ${CUDA_LIB_DIR}/libcublasLt.so* 2>/dev/null | head -1) \
            $(ls ${CUDA_LIB_DIR}/libggml*.so 2>/dev/null)

          file llama-cli | grep -q "ARM aarch64" && echo "✓ Binary is aarch64" || echo "::warning::Binary might not be aarch64"
          ls -lh /tmp/llama-cuda-thor.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cuda-thor
          path: /tmp/llama-cuda-thor.tar.gz
          retention-days: 90
          compression-level: 0
