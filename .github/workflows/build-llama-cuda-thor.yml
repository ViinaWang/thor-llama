name: Build llama.cpp for Thor (aarch64 + CUDA SM101)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Setup QEMU for arm64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build in arm64 Docker container
        run: |
          mkdir -p output
          docker run --rm \
            --platform linux/arm64 \
            -v $(pwd)/output:/output \
            ubuntu:24.04 \
            bash -c '
              set -e
              echo "=== Arch check ==="
              uname -m
              cat /etc/os-release | head -2

              echo "=== Install deps ==="
              apt-get update -qq
              apt-get install -y -qq cmake build-essential wget git file

              echo "=== Download CUDA 12.8 aarch64 ==="
              wget -q https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/cuda_12.8.0_565.57.01_linux_sbsa_aarch64.deb
              dpkg -i cuda_12.8.0_565.57.01_linux_sbsa_aarch64.deb 2>/dev/null || true
              apt-get install -yf -qq 2>/dev/null || true

              # 如果 dpkg 不行, 用 runfile
              if ! command -v nvcc &>/dev/null; then
                echo "dpkg failed, trying runfile..."
                wget -q https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/cuda_12.8.0_565.57.01_linux_sbsa_aarch64.run
                chmod +x cuda_12.8.0_565.57.01_linux_sbsa_aarch64.run
                ./cuda_12.8.0_565.57.01_linux_sbsa_aarch64.run --silent --toolkit 2>/dev/null || true
                export PATH=/usr/local/cuda-12.8/bin:$PATH
              fi

              # 最终检查
              nvcc --version 2>/dev/null | tail -1 || {
                echo "=== Fallback: trying apt repo ==="
                apt-get install -y -qq software-properties-common gnupg
                wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/cuda-keyring_1.1-1_all.deb
                dpkg -i cuda-keyring_1.1-1_all.deb 2>/dev/null || true
                apt-get update -qq
                apt-get install -y -qq cuda-nvcc-12-8 2>/dev/null || true
                ls /usr/local/cuda*/bin/nvcc 2>/dev/null || echo "NO NVCC"
                nvcc --version 2>/dev/null | tail -1
              }

              echo "=== Clone and build llama.cpp ==="
              git clone --depth 1 https://github.com/ggerganov/llama.cpp.git /tmp/llama.cpp
              cd /tmp/llama.cpp
              mkdir -p build && cd build

              cmake .. \
                -DGGML_CUDA=ON \
                -DCMAKE_CUDA_ARCHITECTURES=101 \
                -DCMAKE_BUILD_TYPE=Release

              make -j4

              echo "=== Verify ==="
              file bin/llama-cli
              file bin/llama-server

              echo "=== Copy to output ==="
              cp bin/llama-cli bin/llama-server bin/llama-benchmark bin/llama-quantize /output/

              # 也复制 CUDA 运行时库 (如果不在系统路径)
              for lib in libcudart.so.12 libcublas.so.12 libcublasLt.so.12 libggml-cuda.so; do
                found=$(find /usr/local/cuda* /usr/lib /lib -name "$lib" 2>/dev/null | head -1)
                [ -n "$found" ] && cp "$found" /output/ && echo "Copied: $lib"
              done

              # 复制 libggml 共享库
              for lib in libggml.so libggml-base.so; do
                found=$(find /tmp/llama.cpp/build -name "$lib" 2>/dev/null | head -1)
                [ -n "$found" ] && cp "$found" /output/
              done

              echo "=== Done ==="
              ls -la /output/
            '

      - name: Package
        run: |
          cd output
          ls -la
          tar czf ../llama-cuda-thor.tar.gz *
          cd ..
          file output/llama-cli | grep -q "ARM aarch64" && echo "✓ aarch64 confirmed" || echo "⚠ Check binary arch"
          ls -lh llama-cuda-thor.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cuda-thor
          path: llama-cuda-thor.tar.gz
          retention-days: 90
          compression-level: 0
